<!DOCTYPE html>
<html lang="zh-HK">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Green Door Coffee</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- =====================================
  HEADER
  ===================================== -->
  <div class="container">
    <div class="hero">
      <p class="eyebrow">Green Door Coffee</p>
      <h1>沖煮哲學 · Brewing Philosophy</h1>
      <p class="hero-subtitle">
        一套圍繞萃取平衡、水流行為與咖啡本質設計的沖煮系統。
        <br>
        A coffee brewing system designed around extraction balance, flow behaviour, and coffee character.
      </p>
    </div>
  </div>

  <!-- =====================================
  NAVIGATION
  ===================================== -->
  <!--
  <nav class="top-nav">

    <a href="index.html" class="active">手沖沖煮哲學</a>
    <a href="https://greendoorcoffee.com/espresso-recipe/">Espresso Recipe</a>
    <a href="signature.html">
      手沖特色飲品
    </a>

  </nav>
  -->
  <!-- =====================================
  MAIN CONTENT
  ===================================== -->
  <main class="container">

    <!-- =====================================
    CONTROLS
    ===================================== -->
    <section class="control-panel">

      <!-- 處理法 -->
      <div class="field">

        <label>處理法 · Process</label>

        <select id="processFilter">
          <option value="all">全部 · All Processes</option>
          <option value="washed">Washed</option>
          <option value="natural">Natural</option>
          <option value="honey">Honey</option>
          <option value="anaerobic">Anaerobic</option>
        </select>

      </div>

      <!-- 咖啡豆 -->
      <div class="field">
        <label>咖啡豆 · Coffee</label>
        <select id="coffeeSelect"></select>
      </div>

      <!-- 沖煮意向 -->
      <div class="field">

        <label>沖煮意向 · Brewing Intention</label>

        <select id="flavorSelect">
          <option value="clarity">花香／茶感 · Floral / Tea-like Clarity</option>
          <option value="balanced">平衡甜感 · Balanced Sweetness</option>
          <option value="body">厚重口感／朱古力 · Heavy Body / Chocolate</option>
          <option value="funky">發酵感／酒香 · Funky / Fermentation Forward</option>
          <option value="clarity-sweet">清澈甜感 · Clean & Sweet (Bypass)</option>
          <option value="iced-drip">凍滴濾泡 · Iced Drip Coffee</option>
        </select>
      </div>

    </section>

    <!-- =====================================
    RESULT
    ===================================== -->
    <section class="result-wrapper">

      <div id="resultPlaceholder" class="placeholder">

        Select a coffee and brewing intention
        to explore brewing philosophy.

      </div>

      <div id="result"></div>

    </section>

  </main>

  <!-- =====================================
  SCRIPTS
  ===================================== -->
  <script src="data.js"></script>
  <script src="processFilter.js"></script>
  <script src="recipeRenderer.js"></script>
  <script src="app.js"></script>

</body>
</html>
