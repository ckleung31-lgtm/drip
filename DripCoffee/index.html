<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Green Door Coffee Brewing Philosophy
  </title>

  <!-- CSS -->
  <link
    rel="stylesheet"
    href="css/style.css"
  >

</head>

<body>


  <div class="gdc-brew-app">

    <div class="container">


      <!-- HERO -->
      <header class="hero">

        <p class="eyebrow">
          Green Door Coffee
        </p>

        <h1>
          Brewing Philosophy
        </h1>

        <p class="hero-text">
          A coffee brewing system designed
          around extraction balance,
          flow behaviour,
          and coffee character.
        </p>

      </header>



      <!-- FORM -->
      <section class="card">


        <!-- BREW TYPE -->
        <div class="field">

          <label for="brewType">
            Brewing Type
          </label>

          <select id="brewType">

            <option value="filter">
              Filter / Pour Over
            </option>

            <option value="espresso">
              Espresso
            </option>

          </select>

        </div>



        <!-- COFFEE -->
        <div class="field">

          <label for="coffeeSelect">
            Select Coffee
          </label>

          <select id="coffeeSelect">
          </select>

        </div>



        <!-- INTENTION -->
        <div class="field">

          <label for="flavorSelect">
            Brewing Intention
          </label>

          <select id="flavorSelect">

            <option value="clarity">
              Floral / Tea-like Clarity
            </option>

            <option value="balanced">
              Balanced Sweetness
            </option>

            <option value="body">
              Heavy Body / Chocolate
            </option>

            <option value="funky">
              Funky / Fermentation Forward
            </option>

          </select>

        </div>



        <!-- BUTTON -->
        <button id="generateBtn">

          Generate Brewing Recipe

        </button>

      </section>



      <!-- RESULT -->
      <section class="result-card">

        <div
          id="resultPlaceholder"
          class="placeholder"
        >

          Select a coffee to generate
          a brewing recommendation.

        </div>

        <div id="result">
        </div>

      </section>

    </div>

  </div>



  <!-- DATA -->
  <script src="js/data.js"></script>

  <!-- APP -->
  <script src="js/app.js"></script>


</body>

</html>
